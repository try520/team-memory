services:
  memory:
    build: .
    # 可本地构建（docker compose up -d --build）；预构建镜像已公开发布在阿里云，匿名可拉。
    image: registry.cn-hangzhou.aliyuncs.com/mybase-tools/develop-memory:0.1.5
    container_name: team-memory
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      PORT: "8080"
      TZ: Asia/Shanghai
    volumes:
      # 宿主机目录挂进去即可；备份直接打包这个目录。
      - ./data:/data
